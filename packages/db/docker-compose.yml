name: perps-exchange

services:
  postgres:
    image: postgres
    container_name: perps-exchange-postgres
    environment:
      POSTGRES_DB: perps-exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - perps-exchange_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: perps-exchange-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - perps-exchange_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  perps-exchange_postgres_data:
  perps-exchange_redis_data:
