name: perp-v1-boilerplate

services:
  postgres:
    image: postgres
    container_name: perp-v1-boilerplate-postgres
    environment:
      POSTGRES_DB: perp-v1-boilerplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - perp-v1-boilerplate_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  perp-v1-boilerplate_postgres_data:
